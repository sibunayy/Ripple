<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- RippleFlow app icon: rings spreading from a point, in the app's accent blue on its dark background.
       Full-bleed square (iPadOS rounds the corners); the artwork stays inside the central 80% maskable safe zone. -->
  <rect width="512" height="512" fill="#0e0d0c"/>
  <g fill="none" stroke="rgb(54 156 255)" stroke-linecap="round">
    <circle cx="256" cy="256" r="58" stroke-width="22"/>
    <circle cx="256" cy="256" r="112" stroke-width="16" stroke-opacity=".7"/>
    <circle cx="256" cy="256" r="164" stroke-width="11" stroke-opacity=".4"/>
  </g>
  <circle cx="256" cy="256" r="20" fill="#f4efe9"/>
</svg>
